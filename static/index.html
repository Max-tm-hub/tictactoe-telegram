<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Крестики-нолики</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            margin: 20px auto;
            max-width: 310px;
        }
        .cell {
            width: 100px;
            height: 100px;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .cell.x {
            color: #ff5722;
        }
        .cell.o {
            color: #2196f3;
        }
        .cell.winner {
            background-color: #e8f5e9;
        }
        #status {
            font-size: 18px;
            margin: 10px 0;
            color: #333;
        }
        #stats {
            font-size: 16px;
            margin: 10px 0;
            color: #555;
        }
        #inviteLink {
            margin: 10px 0;
            word-break: break-all;
        }
        #copyLinkBtn, #startGameBtn, #restartGameBtn, #closeGameBtn {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 0;
        }
        #restartGameBtn, #closeGameBtn {
            background-color: #2196f3;
        }
        #closeGameBtn {
            background-color: #f44336;
        }
        #chatBox {
            margin-top: 20px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        #chatMessages {
            height: 200px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            background-color: white;
            margin-bottom: 10px;
            text-align: left;
        }
        #chatInput {
            width: 70%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        #sendBtn {
            width: 25%;
            padding: 10px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #endModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            align-items: center;
            justify-content: center;
        }
        #endModal .modal-content {
            background: white;
            padding: 24px;
            border-radius: 8px;
            text-align: center;
            min-width: 280px;
        }
        #endWinnerText {
            font-size: 20px;
            margin-bottom: 16px;
        }
        #endBtns button {
            margin: 8px;
            padding: 10px 16px;
        }
    </style>
</head>
<body>
    <h1>Крестики-нолики</h1>
    <div id="stats">🏆 0 побед | 💀 0 поражений | 🤝 0 ничьих</div>
    <div id="status" class="status">Загрузка...</div>
    <div id="board" class="board"></div>
    <div id="inviteLink"></div>
    <button id="copyLinkBtn" style="display: none;">Скопировать ссылку</button>
    <button id="startGameBtn" style="display: none;">Начать игру</button>
    <button id="restartGameBtn" style="display: none;">Новая игра</button>
    <button id="closeGameBtn" style="display: none;">Закрыть игру</button>
    <div id="chatBox" style="display: none;">
        <div id="chatMessages"></div>
        <input id="chatInput" type="text" maxlength="100" placeholder="Напишите сообщение...">
        <button id="sendBtn">Отправить</button>
    </div>

    <div id="endModal">
        <div class="modal-content">
            <div id="endWinnerText">Игра окончена</div>
            <div id="endBtns" class="end-buttons">
                <button id="endGameBtn" style="display:none;">Завершить игру</button>
                <button id="restartGameModalBtn" style="display:none;">Перезапустить игру</button>
                <button id="closeEndModalBtn">Закрыть</button>
            </div>
        </div>
    </div>

    <script>
        if (!window.Telegram || !window.Telegram.WebApp) {
            console.error("Telegram WebApp объект недоступен.");
            document.getElementById('status').textContent = "Ошибка: Telegram WebApp недоступен.";
            throw new Error("Telegram WebApp недоступен.");
        }
        const Telegram = window.Telegram.WebApp;
        Telegram.expand();
        const BACKEND = "https://tictactoe-telegram.onrender.com";
        let gameId = null;
        let gameWs = null;
        let chatWs = null;
        const statusDiv = document.getElementById('status');
        const boardDiv = document.getElementById('board');
        const statsDiv = document.getElementById('stats');
        const inviteLinkDiv = document.getElementById('inviteLink');
        const copyLinkBtn = document.getElementById('copyLinkBtn');
        const startGameBtn = document.getElementById('startGameBtn');
        const restartGameBtn = document.getElementById('restartGameBtn');
        const closeGameBtn = document.getElementById('closeGameBtn');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatMessages = document.getElementById('chatMessages');
        const endModal = document.getElementById('endModal');
        const endWinnerText = document.getElementById('endWinnerText');
        const endGameBtn = document.getElementById('endGameBtn');
        const restartGameModalBtn = document.getElementById('restartGameModalBtn');
        const closeEndModalBtn = document.getElementById('closeEndModalBtn');
        let endModalShown = false;

        if (!Telegram.initDataUnsafe || !Telegram.initDataUnsafe.user) {
            console.error("Telegram WebApp initDataUnsafe.user недоступен.");
            statusDiv.textContent = "Ошибка: Не удалось получить данные пользователя.";
            throw new Error("Telegram WebApp initDataUnsafe.user недоступен.");
        }

        const initDataUnsafe = Telegram.initDataUnsafe;
        const urlParams = new URLSearchParams(window.location.search);
        const startParamFromURL = urlParams.get('startapp');
        const startParam = initDataUnsafe?.start_param || startParamFromURL;

        function connectGameWs(gameId) {
            const wsUrl = BACKEND.replace('https://', 'wss://').replace('http://', 'ws://');
            gameWs = new WebSocket(`${wsUrl}/ws/${gameId}`);
            gameWs.onopen = () => {
                console.log("WebSocket соединение установлено для игры", gameId);
            };
            gameWs.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                console.log("Получено сообщение от WebSocket игры:", msg);
                if (msg.type === "game") {
                    renderGame(msg);
                } else if (msg.type === "chat") {
                    chatMessages.innerHTML += `<div><b>${msg.username}:</b> ${msg.text}</div>`;
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }
            };
            gameWs.onclose = (event) => {
                if (event.code === 1000 && event.reason === "Игра перезапущена") {
                    console.log("WebSocket игры закрыт сервером: игра перезапущена.");
                } else {
                    statusDiv.textContent = "Соединение с игрой потеряно.";
                    console.log("WebSocket игры отключен для игры", gameId, "Код:", event.code, "Причина:", event.reason);
                }
            };
            gameWs.onerror = (error) => {
                console.error("Ошибка WebSocket игры для", gameId, error);
            };
        }

        function connectChatWs(gameId) {
            const wsUrl = BACKEND.replace('https://', 'wss://').replace('http://', 'ws://');
            if (chatWs) {
                chatWs.close();
            }
            chatWs = new WebSocket(`${wsUrl}/ws/chat/${gameId}`);
            chatWs.onopen = () => {
                console.log("WebSocket соединение установлено для чата", gameId);
                sendBtn.disabled = false;
            };
            chatWs.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                console.log("Получено сообщение от WebSocket чата:", msg);
                if (msg.type === "chat") {
                    chatMessages.innerHTML += `<div><b>${msg.username}:</b> ${msg.text}</div>`;
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }
            };
            chatWs.onclose = (event) => {
                console.log("WebSocket чата отключен для игры", gameId, "Код:", event.code, "Причина:", event.reason);
            };
            chatWs.onerror = (error) => {
                console.error("Ошибка WebSocket чата для", gameId, error);
                sendBtn.style.backgroundColor = '#f44336';
                sendBtn.disabled = true;
            };
        }

        async function loadStats() {
            try {
                const res = await fetch(`${BACKEND}/api/stats`, {
                    headers: { 'X-Init-Data': Telegram.initData }
                });
                const stats = await res.json();
                statsDiv.innerHTML = `🏆 ${stats.wins || 0} побед | 💀 ${stats.losses || 0} поражений | 🤝 ${stats.draws || 0} ничьих`;
            } catch (e) {
                statsDiv.innerHTML = `🏆 0 побед | 💀 0 поражений | 🤝 0 ничьих`;
                console.error(`Ошибка загрузки статистики: ${e.message}`);
            }
        }

        async function createGame() {
            try {
                const res = await fetch(`${BACKEND}/api/create-game`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: Telegram.initData })
                });
                if (!res.ok) {
                    throw new Error("Не удалось создать игру");
                }
                const data = await res.json();
                gameId = data.game_id;
                inviteLinkDiv.innerHTML = `Ссылка для приглашения: <a id="inviteLinkAnchor" href="${data.invite_link}" target="_blank">${data.invite_link}</a>`;
                copyLinkBtn.style.display = 'block';
                connectGameWs(gameId);
                statusDiv.textContent = "Игра создана! Ожидание второго игрока...";
                boardDiv.style.display = 'none';
                renderEmptyBoard();
            } catch (e) {
                statusDiv.textContent = "Ошибка создания игры.";
                Telegram.WebApp.showPopup({ title: "Ошибка", message: "Не удалось создать игру." });
                console.error(`Ошибка создания игры: ${e.message}`);
            }
        }

        async function joinGame(gameId) {
            try {
                const res = await fetch(`${BACKEND}/api/join-game`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: Telegram.initData, game_id: gameId })
                });
                if (!res.ok) {
                    throw new Error("Не удалось присоединиться к игре");
                }
                connectGameWs(gameId);
                connectChatWs(gameId);
                statusDiv.textContent = "Вы присоединились к игре!";
                boardDiv.style.display = 'none';
            } catch (e) {
                statusDiv.textContent = "Не удалось присоединиться.";
                Telegram.WebApp.showPopup({ title: "Ошибка", message: "Игра не найдена или уже заполнена." });
                console.error(`Ошибка присоединения к игре: ${e.message}`);
            }
        }

        async function startGame() {
            try {
                const res = await fetch(`${BACKEND}/api/start-game`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: Telegram.initData, game_id: gameId })
                });
                if (!res.ok) {
                    throw new Error("Не удалось начать игру");
                }
            } catch (e) {
                Telegram.WebApp.showPopup({ title: "Ошибка", message: "Не удалось начать игру." });
                console.error(`Ошибка начала игры: ${e.message}`);
            }
        }

        async function restartGame() {
            try {
                const res = await fetch(`${BACKEND}/api/restart-game`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: Telegram.initData, game_id: gameId })
                });
                if (!res.ok) {
                    throw new Error("Не удалось перезапустить игру");
                }
                const data = await res.json();
                gameId = data.new_game_id;
                console.log("Запрос на перезапуск игры отправлен. Ожидание новой игры с ID:", gameId);
            } catch (e) {
                Telegram.WebApp.showPopup({ title: "Ошибка", message: "Не удалось перезапустить игру." });
                console.error(`Ошибка перезапуска игры: ${e.message}`);
            }
        }

        async function endGameFromModal() {
            try {
                const res = await fetch(`${BACKEND}/api/end-game`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: Telegram.initData, game_id: gameId })
                });
                if (!res.ok) {
                    throw new Error("Не удалось завершить игру");
                }
                hideEndModal();
            } catch (e) {
                Telegram.WebApp.showPopup({ title: "Ошибка", message: "Не удалось завершить игру." });
                console.error(`Ошибка завершения игры: ${e.message}`);
            }
        }

        async function makeMove(row, col) {
            console.log("Попытка сделать ход в ячейку:", row, col, "Game ID:", gameId);
            try {
                if (typeof row !== 'number' || typeof col !== 'number' || row < 0 || row > 2 || col < 0 || col > 2) {
                    throw new Error(`Некорректные координаты хода: row=${row}, col=${col}`);
                }
                const res = await fetch(`${BACKEND}/api/make-move`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: Telegram.initData, game_id: gameId, row, col })
                });
                if (!res.ok) {
                    const errorText = await res.text();
                    console.error(`Сервер вернул ошибку: ${res.status} ${res.statusText}`, errorText);
                    throw new Error(`Сервер вернул ошибку: ${res.status} ${res.statusText}`);
                }
                console.log("Ход успешно отправлен.");
            } catch (e) {
                Telegram.WebApp.showPopup({ title: "Ошибка", message: "Не удалось сделать ход." });
                console.error(`Ошибка хода: ${e.message}`);
            }
        }

        function renderEmptyBoard() {
            boardDiv.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    boardDiv.appendChild(cell);
                }
            }
        }

        function renderGame(game) {
            console.log("Отрисовка игры с данными:", game);
            if (!Telegram.initDataUnsafe || !Telegram.initDataUnsafe.user) {
                console.error("Telegram WebApp initDataUnsafe.user недоступен при отрисовке.");
                statusDiv.textContent = "Ошибка: Не удалось получить данные пользователя.";
                return;
            }
            const user = Telegram.initDataUnsafe.user;
            const myId = String(user.id);
            const isCreator = myId === String(game.creator_id);
            const mySymbol = isCreator ? 'X' : 'O';
            const opponentName = game.opponent_name || 'Ожидание...';
            const creatorName = game.creator_name;
            const isFinished = Boolean(game.winner) || game.winner === "draw";

            if (game.winner === 'draw') {
                statusDiv.textContent = "Ничья!";
            } else if (game.winner) {
                const winnerName = game.winner === 'X' ? creatorName : opponentName;
                statusDiv.textContent = `Победил(а) ${winnerName}!`;
            } else if (!game.opponent_id) {
                statusDiv.textContent = "Ожидание второго игрока...";
                document.getElementById('startGameBtn').style.display = 'none';
                boardDiv.style.display = 'none';
            } else if (!game.game_started) {
                statusDiv.textContent = "Ожидание начала игры...";
                boardDiv.style.display = 'none';
                if (!isCreator) {
                    document.getElementById('startGameBtn').style.display = 'block';
                } else {
                    document.getElementById('startGameBtn').style.display = 'none';
                }
            } else {
                statusDiv.textContent = "Игра началась!";
                document.getElementById('startGameBtn').style.display = 'none';
                boardDiv.style.display = 'grid';

                let boardToRender = game.board;
                if (typeof game.board === 'string') {
                    try {
                        boardToRender = JSON.parse(game.board);
                    } catch (e) {
                        console.error("Ошибка парсинга доски:", e);
                        statusDiv.textContent = "Ошибка: неверный формат доски.";
                        return;
                    }
                }
                if (!Array.isArray(boardToRender) || boardToRender.length !== 3 || !boardToRender.every(r => Array.isArray(r) && r.length === 3)) {
                    console.error("Доска имеет неверный формат:", boardToRender);
                    statusDiv.textContent = "Ошибка: неверный формат доски.";
                    return;
                }

                boardDiv.innerHTML = '';
                for (let i = 0; i < 3; i++) {
                    for (let j = 0; j < 3; j++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        const val = boardToRender[i][j];
                        if (val) {
                            if (val === 'X' || val === 'O') {
                                cell.textContent = val;
                                cell.classList.add(val.toLowerCase());
                                const isWinnerCell = game.winner && val === game.winner;
                                if (isWinnerCell) cell.classList.add('winner');
                            } else {
                                cell.textContent = '';
                            }
                        }
                        if (game.game_started && !isFinished && game.current_turn == myId && !val) {
                            cell.onclick = () => makeMove(i, j);
                        }
                        boardDiv.appendChild(cell);
                    }
                }
                if (!isFinished) {
                    if (game.current_turn == myId) {
                        statusDiv.textContent = "Ваш ход!";
                    } else {
                        statusDiv.textContent = "Ход соперника...";
                    }
                } else {
                    showEndModal(isCreator, game);
                }
            }

            if (game.opponent_id) {
                document.getElementById('chatBox').style.display = 'block';
                if (!chatWs || chatWs.readyState === WebSocket.CLOSED) {
                    connectChatWs(gameId);
                }
            } else {
                document.getElementById('chatBox').style.display = 'none';
            }
        }

        function showEndModal(isCreator, game) {
            if (endModalShown) return;
            let endText = "";
            if (game.winner === "draw") {
                endText = "Игра окончена: ничья";
            } else {
                const winnerName = (game.winner === "X") ? game.creator_name : (game.opponent_name || "Игрок");
                endText = `Победил(а): ${winnerName}`;
            }
            endWinnerText.textContent = endText;
            if (isCreator) {
                endGameBtn.style.display = 'inline-block';
                restartGameModalBtn.style.display = 'inline-block';
            } else {
                endGameBtn.style.display = 'none';
                restartGameModalBtn.style.display = 'none';
            }
            closeEndModalBtn.textContent = "Закрыть";
            endModal.style.display = 'flex';
            endModalShown = true;

            endGameBtn.onclick = endGameFromModal;
            restartGameModalBtn.onclick = () => {
                restartGame();
            };
            closeEndModalBtn.onclick = () => {
                hideEndModal();
            };
        }

        function hideEndModal() {
            endModal.style.display = 'none';
            endModalShown = false;
            endGameBtn.style.display = 'none';
            restartGameModalBtn.style.display = 'none';
        }

        copyLinkBtn.onclick = () => {
            const linkEl = document.getElementById('inviteLinkAnchor');
            if (!linkEl) return;
            const url = linkEl.href;
            navigator.clipboard.writeText(url).then(() => {
                Telegram.WebApp.showPopup({ title: "✅ Скопировано!", message: "Ссылка скопирована!" });
            }).catch(() => {
                Telegram.WebApp.showPopup({ title: "❌ Ошибка", message: "Не удалось скопировать ссылку." });
            });
        };

        startGameBtn.onclick = startGame;
        restartGameBtn.onclick = restartGame;
        closeGameBtn.onclick = () => {
            Telegram.WebApp.close();
        };

        sendBtn.onclick = () => {
            const text = chatInput.value.trim();
            if (text && chatWs && chatWs.readyState === WebSocket.OPEN) {
                try {
                    chatWs.send(JSON.stringify({ initData: Telegram.initData, text }));
                    chatInput.value = '';
                } catch (e) {
                    Telegram.WebApp.showPopup({ title: "Ошибка", message: "Не удалось отправить сообщение." });
                    console.error(`Ошибка отправки сообщения в WebSocket чата: ${e.message}`);
                }
            } else {
                Telegram.WebApp.showPopup({ title: "Ошибка", message: "Соединение с чатом не установлено." });
                if (gameId) {
                    connectChatWs(gameId);
                }
            }
        };

        chatInput.onkeypress = (e) => { if (e.key === 'Enter') sendBtn.click(); };

        document.addEventListener('DOMContentLoaded', async () => {
            console.log("DOMContentLoaded с initDataUnsafe:", Telegram.initDataUnsafe);
            await loadStats();
            if (startParam && typeof startParam === 'string' && startParam.length === 8) {
                gameId = startParam;
                await joinGame(gameId);
            } else {
                await createGame();
            }
        });
    </script>
</body>
</html>
