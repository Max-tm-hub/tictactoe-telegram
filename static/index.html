<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Крестики-нолики</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            margin: 20px auto;
            max-width: 310px;
        }
        .cell {
            width: 100px;
            height: 100px;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .cell.x {
            color: #ff5722;
        }
        .cell.o {
            color: #2196f3;
        }
        .cell.winner {
            background-color: #e8f5e9;
        }
        #status {
            font-size: 18px;
            margin: 10px 0;
            color: #333;
        }
        #stats {
            font-size: 16px;
            margin: 10px 0;
            color: #555;
        }
        #inviteLink {
            margin: 10px 0;
            word-break: break-all;
        }
        #copyLinkBtn, #startGameBtn, #restartGameBtn, #closeGameBtn {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 0;
        }
        #restartGameBtn, #closeGameBtn {
            background-color: #2196f3;
        }
        #closeGameBtn {
            background-color: #f44336;
        }
        #chatBox {
            margin-top: 20px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        #chatMessages {
            height: 200px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            background-color: white;
            margin-bottom: 10px;
            text-align: left;
        }
        #chatInput {
            width: 70%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        #sendBtn {
            width: 25%;
            padding: 10px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Крестики-нолики</h1>
    <div id="stats">🏆 0 побед | 💀 0 поражений | 🤝 0 ничьих</div>
    <div id="status" class="status">Загрузка...</div>
    <div id="board" class="board"></div>
    <div id="inviteLink"></div>
    <button id="copyLinkBtn" style="display: none;">Скопировать ссылку</button>
    <button id="startGameBtn" style="display: none;">Начать игру</button>
    <button id="restartGameBtn" style="display: none;">Новая игра</button>
    <button id="closeGameBtn" style="display: none;">Закрыть игру</button>
    <div id="chatBox" style="display: none;">
        <div id="chatMessages"></div>
        <input id="chatInput" type="text" maxlength="100" placeholder="Напишите сообщение...">
        <button id="sendBtn">Отправить</button>
    </div>
    <script>
        if (!window.Telegram || !window.Telegram.WebApp) {
            console.error("Telegram WebApp объект недоступен.");
            document.getElementById('status').textContent = "Ошибка: Telegram WebApp недоступен.";
            throw new Error("Telegram WebApp недоступен.");
        }

        const Telegram = window.Telegram.WebApp;
        Telegram.expand();
        const BACKEND = "https://tictactoe-telegram.onrender.com";
        let gameId = null;
        let gameWs = null;
        let chatWs = null;

        const statusDiv = document.getElementById('status');
        const boardDiv = document.getElementById('board');
        const statsDiv = document.getElementById('stats');
        const inviteLinkDiv = document.getElementById('inviteLink');
        const copyLinkBtn = document.getElementById('copyLinkBtn');
        const startGameBtn = document.getElementById('startGameBtn');
        const restartGameBtn = document.getElementById('restartGameBtn');
        const closeGameBtn = document.getElementById('closeGameBtn');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatMessages = document.getElementById('chatMessages');

        if (!Telegram.initDataUnsafe || !Telegram.initDataUnsafe.user) {
            console.error("Telegram WebApp initDataUnsafe.user недоступен.");
            statusDiv.textContent = "Ошибка: Не удалось получить данные пользователя.";
            throw new Error("Telegram WebApp initDataUnsafe.user недоступен.");
        }

        const initDataUnsafe = Telegram.initDataUnsafe;
        const urlParams = new URLSearchParams(window.location.search);
        const startParamFromURL = urlParams.get('startapp');
        const startParam = initDataUnsafe?.start_param || startParamFromURL;

        function connectGameWs(currentGameId) {
            const wsUrl = BACKEND.replace('https://', 'wss://').replace('http://', 'ws://');
            gameWs = new WebSocket(`${wsUrl}/ws/${currentGameId}`);

            gameWs.onopen = () => {
                console.log("WebSocket соединение установлено для игры", currentGameId);
            };

            gameWs.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                console.log("Получено сообщение от WebSocket игры:", msg);
                if (msg.type === "game") {
                    renderGame(msg);
                } else if (msg.type === "chat") {
                    chatMessages.innerHTML += `<div><b>${msg.username}:</b> ${msg.text}</div>`;
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }
            };

            gameWs.onclose = (event) => {
                if (event.code === 1000 && event.reason === "Игра перезапущена") {
                    console.log("WebSocket игры закрыт сервером: игра перезапущена.");
                } else {
                    statusDiv.textContent = "Соединение с игрой потеряно.";
                    console.log("WebSocket игры отключен для игры", currentGameId, "Код:", event.code, "Причина:", event.reason);
                }
            };

            gameWs.onerror = (error) => {
                console.error("Ошибка WebSocket игры для", currentGameId, error);
            };
        }

        function connectChatWs(currentGameId) {
            const wsUrl = BACKEND.replace('https://', 'wss://').replace('http://', 'ws://');
            if (chatWs) {
                chatWs.close();
            }
            chatWs = new WebSocket(`${wsUrl}/ws/chat/${currentGameId}`);

            chatWs.onopen = () => {
                console.log("WebSocket соединение установлено для чата", currentGameId);
                sendBtn.style.backgroundColor = '#4caf50';
                sendBtn.disabled = false;
            };

            chatWs.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                console.log("Получено сообщение от WebSocket чата:", msg);
                if (msg.type === "chat") {
                    chatMessages.innerHTML += `<div><b>${msg.username}:</b> ${msg.text}</div>`;
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }
            };

            chatWs.onclose = (event) => {
                console.log("WebSocket чата отключен для игры", currentGameId, "Код:", event.code, "Причина:", event.reason);
            };

            chatWs.onerror = (error) => {
                console.error("Ошибка WebSocket чата для", currentGameId, error);
                sendBtn.style.backgroundColor = '#f44336';
                sendBtn.disabled = true;
            };
        }

        async function loadStats() {
            try {
                const res = await fetch(`${BACKEND}/api/stats`, {
                    headers: { 'X-Init-Data': Telegram.initData }
                });
                if (!res.ok) {
                    throw new Error(`Ошибка загрузки статистики: ${res.status} ${res.statusText}`);
                }
                const stats = await res.json();
                statsDiv.innerHTML = `🏆 ${stats.wins || 0} побед | 💀 ${stats.losses || 0} поражений | 🤝 ${stats.draws || 0} ничьих`;
            } catch (e) {
                statsDiv.innerHTML = `🏆 0 побед | 💀 0 поражений | 🤝 0 ничьих`;
                console.error(`Ошибка загрузки статистики: ${e.message}`);
            }
        }

        async function createGame() {
            try {
                const res = await fetch(`${BACKEND}/api/create-game`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: Telegram.initData })
                });
                if (!res.ok) {
                    const errorText = await res.text();
                    console.error(`Ошибка создания игры: ${res.status} ${res.statusText}`, errorText);
                    throw new Error("Не удалось создать игру");
                }
                const data = await res.json();
                gameId = data.game_id;
                inviteLinkDiv.innerHTML = `Ссылка для приглашения: <a href="${data.invite_link}" target="_blank">${data.invite_link}</a>`;
                copyLinkBtn.style.display = 'block';
                connectGameWs(gameId);
                statusDiv.textContent = "Игра создана! Ожидание второго игрока...";
                boardDiv.style.display = 'none';
                renderEmptyBoard();
            } catch (e) {
                statusDiv.textContent = "Ошибка создания игры.";
                Telegram.showPopup({ title: "Ошибка", message: `Не удалось создать игру: ${e.message}` });
                console.error(`Ошибка создания игры: ${e.message}`);
            }
        }

        async function joinGame(currentGameId) {
            try {
                const res = await fetch(`${BACKEND}/api/join-game`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: Telegram.initData, game_id: currentGameId })
                });
                if (!res.ok) {
                    const errorText = await res.text();
                    console.error(`Ошибка присоединения к игре: ${res.status} ${res.statusText}`, errorText);
                    throw new Error("Не удалось присоединиться к игре");
                }
                connectGameWs(currentGameId);
                connectChatWs(currentGameId);
                statusDiv.textContent = "Вы присоединились к игре!";
                boardDiv.style.display = 'none';
            } catch (e) {
                statusDiv.textContent = "Не удалось присоединиться.";
                Telegram.showPopup({ title: "Ошибка", message: `Не удалось присоединиться: ${e.message}` });
                console.error(`Ошибка присоединения к игре: ${e.message}`);
            }
        }

        async function startGame() {
            try {
                const res = await fetch(`${BACKEND}/api/start-game`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: Telegram.initData, game_id: gameId })
                });
                if (!res.ok) {
                    const errorText = await res.text();
                    console.error(`Ошибка начала игры: ${res.status} ${res.statusText}`, errorText);
                    throw new Error("Не удалось начать игру");
                }
            } catch (e) {
                Telegram.showPopup({ title: "Ошибка", message: `Не удалось начать игру: ${e.message}` });
                console.error(`Ошибка начала игры: ${e.message}`);
            }
        }

        async function restartGame() {
            try {
                const res = await fetch(`${BACKEND}/api/restart-game`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: Telegram.initData, game_id: gameId })
                });
                if (!res.ok) {
                    const errorText = await res.text();
                    console.error(`Ошибка перезапуска игры: ${res.status} ${res.statusText}`, errorText);
                    throw new Error("Не удалось перезапустить игру");
                }
                const data = await res.json();
                gameId = data.new_game_id;
                console.log("Запрос на перезапуск игры отправлен. Ожидание новой игры с ID:", gameId);
            } catch (e) {
                Telegram.showPopup({ title: "Ошибка", message: `Не удалось перезапустить игру: ${e.message}` });
                console.error(`Ошибка перезапуска игры: ${e.message}`);
            }
        }

        async function makeMove(row, col) {
            console.log("Попытка сделать ход в ячейку:", row, col, "Game ID:", gameId);
            try {
                if (typeof row !== 'number' || typeof col !== 'number' || row < 0 || row > 2 || col < 0 || col > 2) {
                    throw new Error(`Некорректные координаты хода: row=${row}, col=${col}`);
                }
                const res = await fetch(`${BACKEND}/api/make-move`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: Telegram.initData, game_id: gameId, row, col })
                });
                if (!res.ok) {
                    const errorText = await res.text();
                    console.error(`Сервер вернул ошибку: ${res.status} ${res.statusText}`, errorText);
                    throw new Error(`Сервер вернул ошибку: ${res.status} ${res.statusText}`);
                }
                console.log("Ход успешно отправлен.");
            } catch (e) {
                Telegram.showPopup({ title: "Ошибка", message: `Не удалось сделать ход: ${e.message}` });
                console.error(`Ошибка хода: ${e.message}`);
            }
        }

        function renderEmptyBoard() {
            boardDiv.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    boardDiv.appendChild(cell);
                }
            }
        }

        function renderGame(game) {
            console.log("Отрисовка игры с данными:", game);

            if (!Telegram.initDataUnsafe || !Telegram.initDataUnsafe.user) {
                console.error("Telegram WebApp initDataUnsafe.user недоступен.");
                statusDiv.textContent = "Ошибка: Не удалось получить данные пользователя.";
                return;
            }

            const user = Telegram.initDataUnsafe.user;
            const myId = String(user.id);
            const isCreator = myId === String(game.creator_id);
            const mySymbol = isCreator ? 'X' : 'O';
            const opponentName = game.opponent_name || 'Ожидание...';
            const creatorName = game.creator_name;

            const isGameFinished = game.winner !== null && game.winner !== undefined;

            if (game.winner === 'draw') {
                statusDiv.textContent = "Ничья!";
            } else if (game.winner) {
                const winnerName = game.winner === 'X' ? creatorName : opponentName;
                statusDiv.textContent = `Победил(а) ${winnerName}!`;
            } else if (!game.opponent_id) {
                statusDiv.textContent = "Ожидание второго игрока...";
                boardDiv.style.display = 'none';
            } else if (!game.game_started) {
                statusDiv.textContent = "Ожидание начала игры...";
                boardDiv.style.display = 'none';
            } else {
                statusDiv.textContent = game.current_turn == myId ? "Ваш ход!" : "Ход соперника...";
                boardDiv.style.display = 'grid';
            }

            boardDiv.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const val = game.board[i][j];
                    if (val) {
                        cell.textContent = val;
                        cell.classList.add(val.toLowerCase());
                        if (isGameFinished && game.winner && val === game.winner) {
                            cell.classList.add('winner');
                        }
                    }
                    if (game.game_started && !isGameFinished && game.current_turn == myId && !val) {
                        cell.onclick = () => makeMove(i, j);
                    }
                    boardDiv.appendChild(cell);
                }
            }

            if (isGameFinished) {
                if (isCreator) {
                    restartGameBtn.style.display = 'inline-block';
                    closeGameBtn.style.display = 'inline-block';
                } else {
                    restartGameBtn.style.display = 'none';
                    closeGameBtn.style.display = 'none';
                }
            } else {
                restartGameBtn.style.display = 'none';
                closeGameBtn.style.display = 'none';
            }

            if (game.opponent_id) {
                document.getElementById('chatBox').style.display = 'block';
                if (!chatWs || chatWs.readyState === WebSocket.CLOSED) {
                    connectChatWs(gameId);
                }
            } else {
                document.getElementById('chatBox').style.display = 'none';
            }
        }

        copyLinkBtn.onclick = () => {
            const linkEl = inviteLinkDiv.querySelector('a');
            if (!linkEl) return;
            const url = linkEl.href;
            navigator.clipboard.writeText(url).then(() => {
                Telegram.showPopup({ title: "✅ Скопировано!", message: "Ссылка скопирована!" });
            }).catch(() => {
                Telegram.showPopup({ title: "❌ Ошибка", message: "Не удалось скопировать ссылку." });
            });
        };

        startGameBtn.onclick = startGame;
        restartGameBtn.onclick = restartGame;
        closeGameBtn.onclick = () => {
            Telegram.WebApp.close();
        };

        sendBtn.onclick = () => {
            const text = chatInput.value.trim();
            if (text && chatWs && chatWs.readyState === WebSocket.OPEN) {
                try {
                    chatWs.send(JSON.stringify({ initData: Telegram.initData, text }));
                    chatInput.value = '';
                } catch (e) {
                    Telegram.showPopup({ title: "Ошибка", message: "Не удалось отправить сообщение." });
                    console.error(`Ошибка отправки сообщения в WebSocket чата: ${e.message}`);
                }
            } else {
                Telegram.showPopup({ title: "Ошибка", message: "Соединение с чатом не установлено." });
                console.error("Попытка отправки сообщения в чат, но WebSocket не открыт. ReadyState:", chatWs ? chatWs.readyState : 'undefined');
                if (gameId) {
                    connectChatWs(gameId);
                }
            }
        };

        chatInput.onkeypress = (e) => { if (e.key === 'Enter') sendBtn.click(); };

        document.addEventListener('DOMContentLoaded', async () => {
            console.log("DOMContentLoaded с initDataUnsafe:", Telegram.initDataUnsafe);
            await loadStats();
            restartGameBtn.style.display = 'none';
            closeGameBtn.style.display = 'none';

            if (startParam && typeof startParam === 'string' && startParam.length === 8) {
                gameId = startParam;
                await joinGame(gameId);
            } else {
                await createGame();
            }
        });
    </script>
</body>
</html>
