<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Крестики-нолики</title>
    <!-- Убираем пробелы из src -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            margin: 20px auto;
            max-width: 310px;
        }
        .cell {
            width: 100px;
            height: 100px;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .cell.x {
            color: #ff5722;
        }
        .cell.o {
            color: #2196f3;
        }
        .cell.winner {
            background-color: #e8f5e9;
        }
        #status {
            font-size: 18px;
            margin: 10px 0;
            color: #333;
        }
        #stats {
            font-size: 16px;
            margin: 10px 0;
            color: #555;
        }
        #inviteLink {
            margin: 10px 0;
            word-break: break-all;
        }
        #copyLinkBtn, #startGameBtn {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 0;
        }
        #chatBox {
            margin-top: 20px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        #chatMessages {
            height: 200px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            background-color: white;
            margin-bottom: 10px;
            text-align: left;
        }
        #chatInput {
            width: 70%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        #sendBtn {
            width: 25%;
            padding: 10px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Крестики-нолики</h1>
    <div id="stats">🏆 0 побед | 💀 0 поражений | 🤝 0 ничьих</div>
    <div id="status" class="status">Загрузка...</div>
    <div id="board" class="board"></div> <!-- Поле будет отображаться только после начала игры -->
    <div id="inviteLink"></div>
    <button id="copyLinkBtn" style="display: none;">Скопировать ссылку</button>
    <button id="startGameBtn" style="display: none;">Начать игру</button>
    <div id="chatBox" style="display: none;">
        <div id="chatMessages"></div>
        <input id="chatInput" type="text" maxlength="100" placeholder="Напишите сообщение...">
        <button id="sendBtn">Отправить</button>
    </div>
    <script>
        // Убедимся, что Telegram.WebApp инициализирован
        if (!window.Telegram || !window.Telegram.WebApp) {
            console.error("Telegram WebApp объект недоступен.");
            document.getElementById('status').textContent = "Ошибка: Telegram WebApp недоступен.";
            throw new Error("Telegram WebApp недоступен.");
        }

        const Telegram = window.Telegram.WebApp;
        Telegram.expand();
        // Используем конкретный адрес сайта
        const BACKEND = "https://tictactoe-telegram.onrender.com"; // Замените на адрес вашего сервера
        let gameId = null;
        let gameWs = null;
        let chatWs = null;
        const statusDiv = document.getElementById('status');
        const boardDiv = document.getElementById('board');
        const statsDiv = document.getElementById('stats');
        const inviteLinkDiv = document.getElementById('inviteLink');
        const copyLinkBtn = document.getElementById('copyLinkBtn');
        const startGameBtn = document.getElementById('startGameBtn');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatMessages = document.getElementById('chatMessages');

        // Проверяем, что initDataUnsafe определён и содержит user
        if (!Telegram.initDataUnsafe || !Telegram.initDataUnsafe.user) {
            console.error("Telegram WebApp initDataUnsafe.user недоступен. Убедитесь, что страница открыта через Telegram WebApp.");
            statusDiv.textContent = "Ошибка: Не удалось получить данные пользователя.";
            // Блокируем дальнейшее выполнение или показываем сообщение
            throw new Error("Telegram WebApp initDataUnsafe.user недоступен.");
        }
        const initDataUnsafe = Telegram.initDataUnsafe;
        const urlParams = new URLSearchParams(window.location.search);
        const startParamFromURL = urlParams.get('startapp');
        const startParam = initDataUnsafe?.start_param || startParamFromURL;

        function connectGameWs(gameId) {
            // Correctly construct the WebSocket URL using the BACKEND variable
            const wsUrl = BACKEND.replace('https://', 'wss://').replace('http://', 'ws://');
            gameWs = new WebSocket(`${wsUrl}/ws/${gameId}`);
            gameWs.onopen = () => {
                console.log("WebSocket соединение установлено для игры", gameId);
            };
            gameWs.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                console.log("Получено сообщение от WebSocket игры:", msg); // Логирование
                if (msg.type === "game") {
                    renderGame(msg); // Теперь вызываем renderGame для отрисовки
                } else if (msg.type === "chat") {
                    chatMessages.innerHTML += `<div><b>${msg.username}:</b> ${msg.text}</div>`;
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }
            };
            gameWs.onclose = (event) => {
                 if (event.code === 1000 && event.reason === "Игра перезапущена") {
                     console.log("WebSocket игры закрыт сервером: игра перезапущена.");
                     // Ничего не делаем, renderGame обработает новую игру
                 } else {
                      statusDiv.textContent = "Соединение с игрой потеряно.";
                      console.log("WebSocket игры отключен для игры", gameId, "Код:", event.code, "Причина:", event.reason);
                 }
            };
            gameWs.onerror = (error) => {
                 console.error("Ошибка WebSocket игры для", gameId, error);
            };
        }

        function connectChatWs(gameId) {
             const wsUrl = BACKEND.replace('https://', 'wss://').replace('http://', 'ws://');
             // Закрываем предыдущее соединение, если оно было
             if (chatWs) {
                 chatWs.close();
             }
             chatWs = new WebSocket(`${wsUrl}/ws/chat/${gameId}`);
             chatWs.onopen = () => {
                  console.log("WebSocket соединение установлено для чата", gameId);
                  // Сбрасываем стили кнопки отправки, если были ошибки
                  sendBtn.style.backgroundColor = '#4caf50';
                  sendBtn.disabled = false; // Возвращаем кнопку в активное состояние
             };
             chatWs.onmessage = (event) => {
                 const msg = JSON.parse(event.data);
                 console.log("Получено сообщение от WebSocket чата:", msg); // Логирование
                 if (msg.type === "chat") {
                      chatMessages.innerHTML += `<div><b>${msg.username}:</b> ${msg.text}</div>`;
                      chatMessages.scrollTop = chatMessages.scrollHeight;
                 }
             };
             chatWs.onclose = (event) => {
                  console.log("WebSocket чата отключен для игры", gameId, "Код:", event.code, "Причина:", event.reason);
                  // Попытка переподключения через 5 секунд
                  // setTimeout(() => connectChatWs(gameId), 5000);
             };
             chatWs.onerror = (error) => {
                  console.error("Ошибка WebSocket чата для", gameId, error);
                  // Помечаем кнопку как неактивную при ошибке
                  sendBtn.style.backgroundColor = '#f44336';
                  sendBtn.disabled = true;
             };
        }

        async function loadStats() {
            try {
                const res = await fetch(`${BACKEND}/api/stats`, {
                    headers: { 'X-Init-Data': Telegram.initData }
                });
                const stats = await res.json();
                statsDiv.innerHTML = `🏆 ${stats.wins || 0} побед | 💀 ${stats.losses || 0} поражений | 🤝 ${stats.draws || 0} ничьих`;
            } catch (e) {
                statsDiv.innerHTML = `🏆 0 побед | 💀 0 поражений | 🤝 0 ничьих`;
                console.error(`Ошибка загрузки статистики: ${e.message}`);
            }
        }

        async function createGame() {
            try {
                const res = await fetch(`${BACKEND}/api/create-game`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: Telegram.initData })
                });
                if (!res.ok) {
                    throw new Error("Не удалось создать игру");
                }
                const data = await res.json();
                gameId = data.game_id;
                inviteLinkDiv.innerHTML = `Ссылка для приглашения: <a href="${data.invite_link}" target="_blank">${data.invite_link}</a>`;
                copyLinkBtn.style.display = 'block';
                connectGameWs(gameId);
                statusDiv.textContent = "Игра создана! Ожидание второго игрока...";
                boardDiv.style.display = 'none'; // Скрываем доску для создателя до начала игры
                renderEmptyBoard(); // Отрисовка пустой доски для создателя до подключения второго игрока
            } catch (e) {
                statusDiv.textContent = "Ошибка создания игры.";
                Telegram.showPopup({ title: "Ошибка", message: "Не удалось создать игру." });
                console.error(`Ошибка создания игры: ${e.message}`);
            }
        }

        async function joinGame(gameId) {
            try {
                const res = await fetch(`${BACKEND}/api/join-game`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: Telegram.initData, game_id: gameId })
                });
                if (!res.ok) {
                    throw new Error("Не удалось присоединиться к игре");
                }
                connectGameWs(gameId);
                connectChatWs(gameId); // Подключаем чат при присоединении
                statusDiv.textContent = "Вы присоединились к игре!";
                boardDiv.style.display = 'none'; // Скрываем доску до начала игры
                // renderEmptyBoard(); // Убираем эту строку, отрисовка теперь в renderGame
            } catch (e) {
                statusDiv.textContent = "Не удалось присоединиться.";
                Telegram.showPopup({ title: "Ошибка", message: "Игра не найдена или уже заполнена." });
                console.error(`Ошибка присоединения к игре: ${e.message}`);
            }
        }

        async function startGame() {
            try {
                const res = await fetch(`${BACKEND}/api/start-game`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: Telegram.initData, game_id: gameId })
                });
                if (!res.ok) {
                    throw new Error("Не удалось начать игру");
                }
                // После успешного запроса сервер обновит состояние игры и отправит его через WebSocket.
                // renderGame() будет вызван автоматически через onmessage.
                // Можно добавить временное сообщение, например: statusDiv.textContent = "Начинаем игру...";
            } catch (e) {
                Telegram.showPopup({ title: "Ошибка", message: "Не удалось начать игру." });
                console.error(`Ошибка начала игры: ${e.message}`);
            }
        }

        async function restartGame() {
            try {
                const res = await fetch(`${BACKEND}/api/restart-game`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: Telegram.initData, game_id: gameId })
                });
                if (!res.ok) {
                    throw new Error("Не удалось перезапустить игру");
                }
                const data = await res.json();
                // gameId обновляется на новый ID
                gameId = data.new_game_id;
                // WebSocket будет закрыт сервером, и новое соединение установится через renderGame
                console.log("Запрос на перезапуск игры отправлен. Ожидание новой игры с ID:", gameId);
                // renderGame обработает новое состояние игры
            } catch (e) {
                Telegram.showPopup({ title: "Ошибка", message: "Не удалось перезапустить игру." });
                console.error(`Ошибка перезапуска игры: ${e.message}`);
            }
        }

        async function makeMove(row, col) {
            console.log("Попытка сделать ход в ячейку:", row, col, "Game ID:", gameId);
            try {
                // Проверим, что row и col - числа в нужном диапазоне
                if (typeof row !== 'number' || typeof col !== 'number' || row < 0 || row > 2 || col < 0 || col > 2) {
                    throw new Error(`Некорректные координаты хода: row=${row}, col=${col}`);
                }
                const res = await fetch(`${BACKEND}/api/make-move`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: Telegram.initData, game_id: gameId, row, col })
                });
                if (!res.ok) {
                    const errorText = await res.text(); // Получим текст ошибки для логирования
                    console.error(`Сервер вернул ошибку: ${res.status} ${res.statusText}`, errorText);
                    throw new Error(`Сервер вернул ошибку: ${res.status} ${res.statusText}`);
                }
                console.log("Ход успешно отправлен.");
            } catch (e) {
                Telegram.showPopup({ title: "Ошибка", message: "Не удалось сделать ход." });
                console.error(`Ошибка хода: ${e.message}`);
            }
        }

        function renderEmptyBoard() {
            boardDiv.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    boardDiv.appendChild(cell);
                }
            }
        }

        function renderGame(game) {
            console.log("Отрисовка игры с данными:", game); // Логирование
            // Проверяем initDataUnsafe снова при отрисовке
            if (!Telegram.initDataUnsafe || !Telegram.initDataUnsafe.user) {
                console.error("Telegram WebApp initDataUnsafe.user недоступен при отрисовке.");
                statusDiv.textContent = "Ошибка: Не удалось получить данные пользователя.";
                return;
            }
            const user = Telegram.initDataUnsafe.user; // Получаем объект пользователя напрямую
            const myId = String(user.id);
            const isCreator = myId === String(game.creator_id);
            const mySymbol = isCreator ? 'X' : 'O';
            const opponentName = game.opponent_name || 'Ожидание...';
            const creatorName = game.creator_name;

            console.log("Мой ID:", myId, "ID Создателя:", game.creator_id, "Я создатель:", isCreator); // Логирование
            console.log("Сырой game.winner:", game.winner, "Тип:", typeof game.winner); // Логирование

            // Проверяем, завершена ли игра (winner определён и не null/undefined)
            // Используем 'in' для проверки, определено ли поле вообще
            const hasWinnerField = 'winner' in game;
            const winnerIsNull = game.winner === null;
            const winnerIsUndefined = game.winner === undefined;
            const isGameFinished = hasWinnerField && !winnerIsNull && !winnerIsUndefined;

            console.log("hasWinnerField:", hasWinnerField, "winnerIsNull:", winnerIsNull, "winnerIsUndefined:", winnerIsUndefined, "isGameFinished:", isGameFinished); // Логирование

            // Обновляем статус игры
            if (game.winner === 'draw') {
                statusDiv.textContent = "Ничья!";
            } else if (game.winner) { // Сюда попадаем, если winner === 'X' или 'O'
                const winnerName = game.winner === 'X' ? creatorName : opponentName;
                statusDiv.textContent = `Победил(а) ${winnerName}!`;
            } else if (!game.opponent_id) {
                statusDiv.textContent = "Ожидание второго игрока...";
                document.getElementById('startGameBtn').style.display = 'none'; // Скрыть кнопку если второго игрока нет
                boardDiv.style.display = 'none'; // Скрыть доску
            } else if (!game.game_started) {
                statusDiv.textContent = "Ожидание начала игры...";
                boardDiv.style.display = 'none'; // Скрыть доску до начала
                // Показать кнопку "Начать игру" только второму игроку, если игра не началась и второй игрок присоединился
                if (!isCreator) {
                    console.log("Показываем кнопку 'Начать игру' второму игроку.");
                    document.getElementById('startGameBtn').style.display = 'block';
                } else {
                    console.log("Скрываем кнопку 'Начать игру' от создателя.");
                    document.getElementById('startGameBtn').style.display = 'none';
                }
            } else { // Игра началась (game.game_started === true)
                statusDiv.textContent = "Игра началась!"; // Обновляем статус
                document.getElementById('startGameBtn').style.display = 'none'; // Скрыть кнопку старта
                boardDiv.style.display = 'grid'; // Показать доску
                // --- НАЧАЛО ИЗМЕНЕНИЙ ---
                // Убедимся, что game.board - это массив массивов
                let boardToRender = game.board;
                if (typeof game.board === 'string') {
                    try {
                        boardToRender = JSON.parse(game.board);
                        console.log("Доска была строкой, распарсена в:", boardToRender);
                    } catch (e) {
                        console.error("Ошибка парсинга доски из строки:", e, "Исходная строка:", game.board);
                        statusDiv.textContent = "Ошибка: повреждённые данные доски.";
                        return; // Прерываем отрисовку
                    }
                }
                if (!Array.isArray(boardToRender) || boardToRender.length !== 3 || !boardToRender.every(row => Array.isArray(row) && row.length === 3)) {
                     console.error("Доска имеет неверный формат:", boardToRender);
                     statusDiv.textContent = "Ошибка: неверный формат доски.";
                     return; // Прерываем отрисовку
                }
                // --- КОНЕЦ ИЗМЕНЕНИЙ ---
                // Очищаем и перерисовываем доску
                boardDiv.innerHTML = '';
                for (let i = 0; i < 3; i++) {
                    for (let j = 0; j < 3; j++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        const val = boardToRender[i][j]; // Используем boardToRender
                        if (val) {
                            // Проверяем, что val - это 'X' или 'O'
                            if (val === 'X' || val === 'O') {
                                cell.textContent = val;
                                cell.classList.add(val.toLowerCase());
                                // Всегда проверяем на победителя для подсветки
                                // Проверяем isGameFinished, чтобы подсветка работала и при завершении
                                if (isGameFinished && game.winner && val === game.winner) {
                                    cell.classList.add('winner');
                                }
                            } else {
                                console.warn(`Некорректное значение в ячейке [${i}][${j}]: ${val}`);
                                // Оставляем ячейку пустой или ставим пробел, если значение не 'X' и не 'O'
                                cell.textContent = '';
                            }
                        }
                        // Проверяем, можно ли сделать ход
                        if (game.game_started && !isGameFinished && game.current_turn == myId && !val) {
                            cell.onclick = () => makeMove(i, j);
                        }
                        boardDiv.appendChild(cell);
                    }
                }
                // Обновляем статус хода, если игра не закончена
                if (!isGameFinished) { // Используем isGameFinished
                    if (game.current_turn == myId) {
                        statusDiv.textContent = "Ваш ход!";
                    } else {
                        statusDiv.textContent = "Ход соперника...";
                    }
                } else { // Игра завершена
                    console.log("Игра завершена, winner:", game.winner, "isCreator:", isCreator);
                    // Отображаем результат в всплывающем окне
                    const winnerName = game.winner === 'X' ? creatorName : opponentName;
                    const resultMessage = game.winner === 'draw' ? "Ничья!" : `Победил(а) ${winnerName}!`;
                    // Подготавливаем кнопки для всплывающего окна
                    const buttons = [
                        {
                            id: "restart",
                            type: "default",
                            text: "Новая игра"
                        },
                        {
                            id: "close",
                            type: "destructive", // Красная кнопка
                            text: "Закрыть игру"
                        }
                    ];
                    // Показываем всплывающее окно с результатом и кнопками
                    Telegram.showPopup({
                        title: "Игра окончена",
                        message: resultMessage,
                        buttons: buttons
                    }).then((buttonId) => {
                        console.log("Выбрана кнопка:", buttonId); // Логирование выбора кнопки
                        if (buttonId === "restart") {
                            // Если нажата кнопка "Новая игра"
                            restartGame();
                        } else if (buttonId === "close") {
                            // Если нажата кнопка "Закрыть игру"
                            Telegram.WebApp.close();
                        }
                    }).catch((error) => {
                         console.error("Ошибка при показе всплывающего окна:", error); // Логирование ошибки showPopup
                    });
                }
            }

            // Показываем чат, если второй игрок присоединился
            if (game.opponent_id) {
                document.getElementById('chatBox').style.display = 'block';
                // Если чатовый WebSocket не подключен, пытаемся подключить (например, после присоединения)
                if (!chatWs || chatWs.readyState === WebSocket.CLOSED) {
                     connectChatWs(gameId);
                }
            } else {
                // Если второго игрока нет, скрываем чат
                document.getElementById('chatBox').style.display = 'none';
            }
        }

        copyLinkBtn.onclick = () => {
            const linkEl = inviteLinkDiv.querySelector('a');
            if (!linkEl) return;
            const url = linkEl.href;
            navigator.clipboard.writeText(url).then(() => {
                Telegram.showPopup({ title: "✅ Скопировано!", message: "Ссылка скопирована!" });
            }).catch(() => {
                Telegram.showPopup({ title: "❌ Ошибка", message: "Не удалось скопировать ссылку." });
            });
        };

        startGameBtn.onclick = startGame;

        sendBtn.onclick = () => {
            const text = chatInput.value.trim();
            // Проверяем, что чатовый WebSocket подключен и открыт
            if (text && chatWs && chatWs.readyState === WebSocket.OPEN) {
                try {
                    chatWs.send(JSON.stringify({ initData: Telegram.initData, text }));
                    chatInput.value = '';
                } catch (e) {
                    Telegram.showPopup({ title: "Ошибка", message: "Не удалось отправить сообщение." });
                    console.error(`Ошибка отправки сообщения в WebSocket чата: ${e.message}`);
                }
            } else {
                 // Если соединение не установлено или закрыто, показываем сообщение
                 Telegram.showPopup({ title: "Ошибка", message: "Соединение с чатом не установлено." });
                 console.error("Попытка отправки сообщения в чат, но WebSocket не открыт. ReadyState:", chatWs ? chatWs.readyState : 'undefined');
                 // Пытаемся переподключиться
                 if (gameId) {
                      connectChatWs(gameId);
                 }
            }
        };

        chatInput.onkeypress = (e) => { if (e.key === 'Enter') sendBtn.click(); };

        document.addEventListener('DOMContentLoaded', async () => {
            console.log("DOMContentLoaded с initDataUnsafe:", Telegram.initDataUnsafe); // Логирование
            await loadStats();
            if (startParam && typeof startParam === 'string' && startParam.length === 8) {
                gameId = startParam;
                await joinGame(gameId);
            } else {
                await createGame();
            }
        });
    </script>
</body>
</html>
