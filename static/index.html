<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Крестики-нолики</title>
    <!-- Исправлено: убраны пробелы -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
            margin: 20px auto;
            max-width: 310px;
        }
        .cell {
            width: 100px;
            height: 100px;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .cell.x {
            color: #ff5722;
        }
        .cell.o {
            color: #2196f3;
        }
        .cell.winner {
            background-color: #e8f5e9;
        }
        #status {
            font-size: 18px;
            margin: 10px 0;
            color: #333;
        }
        #stats {
            font-size: 16px;
            margin: 10px 0;
            color: #555;
        }
        #inviteLink {
            margin: 10px 0;
            word-break: break-all;
        }
        #copyLinkBtn, #startGameBtn {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 0;
        }
        #restartGameBtn {
            background-color: #2196f3; /* Синий */
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 0;
        }
        /* --- ИСПРАВЛЕНО: стиль для неактивной кнопки "Новая игра" --- */
        #restartGameBtn.inactive {
            background-color: #cccccc; /* Серый */
            cursor: not-allowed;
            opacity: 0.6;
        }
        #closeGameBtn {
            background-color: #f44336; /* Красный */
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 0;
        }
        #chatBox {
            margin-top: 20px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
        #chatMessages {
            height: 200px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            background-color: white;
            margin-bottom: 10px;
            text-align: left;
        }
        #chatInput {
            width: 70%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        #sendBtn {
            width: 25%;
            padding: 10px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #endModal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            align-items: center;
            justify-content: center;
        }
        #endModal .modal-content {
            background: white;
            padding: 24px;
            border-radius: 8px;
            text-align: center;
            min-width: 280px;
        }
        #endWinnerText {
            font-size: 20px;
            margin-bottom: 16px;
        }
        #endBtns button {
            margin: 8px;
            padding: 10px 16px;
        }
    </style>
</head>
<body>
    <h1>Крестики-нолики</h1>
    <div id="stats">🏆 0 побед | 💀 0 поражений | 🤝 0 ничьих</div>
    <div id="status" class="status">Загрузка...</div>
    <div id="board" class="board"></div>
    <div id="inviteLink"></div>
    <button id="copyLinkBtn" style="display: none;">Скопировать ссылку</button>
    <button id="startGameBtn" style="display: none;">Начать игру</button>
    <button id="restartGameBtn" style="display: none;">Новая игра</button>
    <button id="closeGameBtn" style="display: none;">Закрыть игру</button>
    <div id="chatBox" style="display: none;">
        <div id="chatMessages"></div>
        <input id="chatInput" type="text" maxlength="100" placeholder="Напишите сообщение...">
        <button id="sendBtn">Отправить</button>
    </div>
    <div id="endModal">
        <div class="modal-content">
            <div id="endWinnerText">Игра окончена</div>
            <div id="endBtns" class="end-buttons">
                <button id="endGameBtn" style="display:none;">Завершить игру</button>
                <button id="restartGameModalBtn" style="display:none;">Перезапустить игру</button>
                <button id="closeEndModalBtn">Закрыть</button>
            </div>
        </div>
    </div>
    <script>
        console.log("Загрузка index.html начата.");

        if (!window.Telegram || !window.Telegram.WebApp) {
            console.error("Telegram WebApp объект недоступен.");
            document.getElementById('status').textContent = "Ошибка: Telegram WebApp недоступен.";
            throw new Error("Telegram WebApp недоступен.");
        }
        const Telegram = window.Telegram.WebApp;
        Telegram.expand();
        console.log("Telegram WebApp инициализирован.");

        // Исправлено: убраны пробелы
        const BACKEND = "https://tictactoe-telegram.onrender.com";
        let gameId = null;
        let gameWs = null;
        let chatWs = null; // Теперь глобально
        const statusDiv = document.getElementById('status');
        const boardDiv = document.getElementById('board');
        const statsDiv = document.getElementById('stats');
        const inviteLinkDiv = document.getElementById('inviteLink');
        const copyLinkBtn = document.getElementById('copyLinkBtn');
        const startGameBtn = document.getElementById('startGameBtn');
        const restartGameBtn = document.getElementById('restartGameBtn');
        const closeGameBtn = document.getElementById('closeGameBtn');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatMessages = document.getElementById('chatMessages');
        const endModal = document.getElementById('endModal');
        const endWinnerText = document.getElementById('endWinnerText');
        const endGameBtn = document.getElementById('endGameBtn');
        const restartGameModalBtn = document.getElementById('restartGameModalBtn');
        const closeEndModalBtn = document.getElementById('closeEndModalBtn');
        let endModalShown = false;

        if (!Telegram.initDataUnsafe || !Telegram.initDataUnsafe.user) {
            console.error("Telegram WebApp initDataUnsafe.user недоступен. Убедитесь, что страница открыта через Telegram WebApp.");
            statusDiv.textContent = "Ошибка: Не удалось получить данные пользователя.";
            throw new Error("Telegram WebApp initDataUnsafe.user недоступен.");
        }
        console.log("Данные пользователя получены.");
        const initDataUnsafe = Telegram.initDataUnsafe;
        const urlParams = new URLSearchParams(window.location.search);
        const startParamFromURL = urlParams.get('startapp');
        const startParam = initDataUnsafe?.start_param || startParamFromURL;

        function connectGameWs(gameIdToConnect) {
            console.log("Попытка подключения к WebSocket игры:", gameIdToConnect);
            const wsUrl = BACKEND.replace('https://', 'wss://').replace('http://', 'ws://');
            const wsFullUrl = `${wsUrl}/ws/${gameIdToConnect}`;
            console.log("WebSocket URL игры:", wsFullUrl);

            // --- ОБНОВЛЕНИЕ: Обновляем gameWs до установки обработчиков ---
            const newGameWs = new WebSocket(wsFullUrl);
            gameWs = newGameWs; // Обновляем глобальную переменную СРАЗУ
            console.log("gameWs обновлён на новое соединение для игры", gameIdToConnect);

            gameWs.onopen = () => {
                console.log("WebSocket соединение установлено для игры", gameIdToConnect);
            };

            gameWs.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    console.log("Получено сообщение от WebSocket игры (ID:", gameIdToConnect, "):", msg);
                    if (msg.type === "game") {
                        renderGame(msg);
                    } else if (msg.type === "chat") { // --- ЛОГИКА ПОЛУЧЕНИЯ ЧАТА ---
                        console.log("Получено сообщение чата:", msg);
                        chatMessages.innerHTML += `<div><b>${msg.username || 'Анон'}:</b> ${msg.text}</div>`;
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                    } else if (msg.type === "restart") {
                        console.log("Получено уведомление о перезапуске игры. Новый ID:", msg.new_game_id);
                        const newGameId = msg.new_game_id;
                        // --- ИСПРАВЛЕНО: сразу обновляем gameId и блокируем доску ---
                        gameId = newGameId;
                        boardDiv.style.pointerEvents = 'none';
                        boardDiv.style.opacity = '0.5';
                        statusDiv.textContent = "Переключение на новую игру...";
                        // Закрываем старые сокеты
                        if (gameWs) {
                            try { gameWs.close(); } catch(e) { console.error("Ошибка закрытия gameWs:", e); }
                        }
                        if (chatWs) {
                            try { chatWs.close(); } catch(e) { console.error("Ошибка закрытия chatWs:", e); }
                        }
                        // Подключаемся к новым сокетам
                        connectGameWs(newGameId); // Создаёт новое соединение и обновляет gameWs
                        connectChatWs(newGameId); // Создаёт новое соединение и обновляет chatWs
                    } else if (msg.type === "error") {
                        console.error("Ошибка от WebSocket игры:", msg.message);
                        statusDiv.textContent = `Ошибка: ${msg.message}`;
                    }
                } catch (e) {
                    console.error("Ошибка парсинга сообщения от WebSocket игры:", e, event.data);
                }
            };

            gameWs.onclose = (event) => {
                 if (event.code === 1000 && event.reason === "Игра перезапущена") {
                     console.log("WebSocket игры закрыт сервером: игра перезапущена.", gameIdToConnect);
                 } else {
                      console.log("WebSocket игры отключен для игры", gameIdToConnect, "Код:", event.code, "Причина:", event.reason);
                      statusDiv.textContent = "Соединение с игрой потеряно.";
                 }
                 // Очищаем глобальную переменную при закрытии, если это текущий сокет
                 if (gameWs === newGameWs) {
                    gameWs = null;
                    console.log("gameWs очищен после закрытия.");
                 }
            };

            gameWs.onerror = (error) => {
                 console.error("Ошибка WebSocket игры для", gameIdToConnect, error);
                 statusDiv.textContent = "Ошибка подключения к игре.";
            };
        }

        function connectChatWs(gameIdToConnect) {
             console.log("Попытка подключения к WebSocket чата:", gameIdToConnect);
             const wsUrl = BACKEND.replace('https://', 'wss://').replace('http://', 'ws://');
             const wsFullUrl = `${wsUrl}/ws/chat/${gameIdToConnect}?initData=${encodeURIComponent(Telegram.initData)}`;
             console.log("WebSocket Chat URL:", wsFullUrl);

             // --- ОБНОВЛЕНИЕ: Обновляем chatWs до установки обработчиков ---
             const newChatWs = new WebSocket(wsFullUrl);
             chatWs = newChatWs; // Обновляем глобальную переменную СРАЗУ
             console.log("chatWs обновлён на новое соединение для чата", gameIdToConnect);

             chatWs.onopen = () => {
                  console.log("WebSocket соединение установлено для чата", gameIdToConnect);
                  sendBtn.disabled = false;
                  sendBtn.style.backgroundColor = '#4caf50';
              };

             chatWs.onmessage = (event) => {
                 try {
                     const msg = JSON.parse(event.data);
                     console.log("Получено сообщение от WebSocket чата (ID:", gameIdToConnect, "):", msg);
                     // Сообщения чата НЕ обрабатываются здесь, они приходят через gameWs
                     // Этот обработчик нужен только для отладки или особых сообщений от чата
                     if (msg.type === "error") {
                         console.error("Ошибка от WebSocket чата:", msg.message);
                         Telegram.showPopup({ title: "Ошибка чата", message: msg.message });
                     }
                 } catch (e) {
                     console.error("Ошибка парсинга сообщения от WebSocket чата:", e, event.data);
                 }
             };

             chatWs.onclose = (event) => {
                  console.log("WebSocket чата отключен для игры", gameIdToConnect, "Код:", event.code, "Причина:", event.reason);
                  sendBtn.disabled = true;
                  sendBtn.style.backgroundColor = '#cccccc';
                  // Очищаем глобальную переменную при закрытии, если это текущий сокет
                  if (chatWs === newChatWs) {
                    chatWs = null;
                    console.log("chatWs очищен после закрытия.");
                  }
             };

             chatWs.onerror = (error) => {
                  console.error("Ошибка WebSocket чата для", gameIdToConnect, error);
                  sendBtn.style.backgroundColor = '#f44336';
                  sendBtn.disabled = true;
             };
        }

        async function loadStats() {
            try {
                console.log("Отправка запроса на загрузку статистики.");
                const res = await fetch(`${BACKEND}/api/stats`, {
                    headers: { 'X-Init-Data': Telegram.initData }
                });
                if (!res.ok) {
                    throw new Error(`HTTP error! status: ${res.status}`);
                }
                const stats = await res.json();
                statsDiv.innerHTML = `🏆 ${stats.wins || 0} побед | 💀 ${stats.losses || 0} поражений | 🤝 ${stats.draws || 0} ничьих`;
                console.log("Статистика загружена:", stats);
            } catch (e) {
                statsDiv.innerHTML = `🏆 0 побед | 💀 0 поражений | 🤝 0 ничьих`;
                console.error(`Ошибка загрузки статистики: ${e.message}`);
            }
        }

        async function createGame() {
            try {
                console.log("Отправка запроса на создание игры.");
                const res = await fetch(`${BACKEND}/api/create-game`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: Telegram.initData })
                });
                if (!res.ok) {
                    const errorText = await res.text();
                    throw new Error(`HTTP error! status: ${res.status}, message: ${errorText}`);
                }
                const data = await res.json();
                gameId = data.game_id;
                inviteLinkDiv.innerHTML = `Ссылка для приглашения: <a href="${data.invite_link}" target="_blank">${data.invite_link}</a>`;
                copyLinkBtn.style.display = 'block';
                connectGameWs(gameId);
                statusDiv.textContent = "Игра создана! Ожидание второго игрока...";
                boardDiv.style.display = 'none';
                renderEmptyBoard();
                console.log("Игра создана, ID:", gameId);
            } catch (e) {
                statusDiv.textContent = "Ошибка создания игры.";
                Telegram.showPopup({ title: "Ошибка", message: `Не удалось создать игру: ${e.message}` });
                console.error(`Ошибка создания игры: ${e.message}`);
            }
        }

        async function joinGame(gameIdToJoin) {
            try {
                console.log("Отправка запроса на присоединение к игре:", gameIdToJoin);
                const res = await fetch(`${BACKEND}/api/join-game`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: Telegram.initData, game_id: gameIdToJoin })
                });
                if (!res.ok) {
                    const errorText = await res.text();
                    throw new Error(`HTTP error! status: ${res.status}, message: ${errorText}`);
                }
                gameId = gameIdToJoin;
                connectGameWs(gameId);
                connectChatWs(gameId); // Подключаемся к чату сразу после присоединения
                statusDiv.textContent = "Вы присоединились к игре!";
                boardDiv.style.display = 'none';
                console.log("Присоединение к игре успешно, ID:", gameId);
            } catch (e) {
                statusDiv.textContent = "Не удалось присоединиться.";
                Telegram.showPopup({ title: "Ошибка", message: `Не удалось присоединиться к игре: ${e.message}` });
                console.error(`Ошибка присоединения к игре: ${e.message}`);
            }
        }

        async function startGame() {
            try {
                console.log("Отправка запроса на начало игры:", gameId);
                const res = await fetch(`${BACKEND}/api/start-game`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: Telegram.initData, game_id: gameId })
                });
                if (!res.ok) {
                    const errorText = await res.text();
                    throw new Error(`HTTP error! status: ${res.status}, message: ${errorText}`);
                }
                console.log("Запрос на начало игры отправлен.");
            } catch (e) {
                Telegram.showPopup({ title: "Ошибка", message: `Не удалось начать игру: ${e.message}` });
                console.error(`Ошибка начала игры: ${e.message}`);
            }
        }

        async function restartGame() {
            try {
                console.log("Отправка запроса на перезапуск игры:", gameId);
                const res = await fetch(`${BACKEND}/api/restart-game`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: Telegram.initData, game_id: gameId })
                });
                if (!res.ok) {
                    const errorText = await res.text();
                    throw new Error(`HTTP error! status: ${res.status}, message: ${errorText}`);
                }
                const data = await res.json();
                console.log("Запрос на перезапуск игры отправлен. Новый ID будет получен через WebSocket.");
            } catch (e) {
                Telegram.showPopup({ title: "Ошибка", message: `Не удалось перезапустить игру: ${e.message}` });
                console.error(`Ошибка перезапуска игры: ${e.message}`);
            }
        }

        async function endGameFromModal() {
            try {
                console.log("Отправка запроса на завершение игры:", gameId);
                const res = await fetch(`${BACKEND}/api/end-game`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: Telegram.initData, game_id: gameId })
                });
                if (!res.ok) {
                    const errorText = await res.text();
                    throw new Error(`HTTP error! status: ${res.status}, message: ${errorText}`);
                }
                hideEndModal();
                console.log("Запрос на завершение игры отправлен.");
                // Закрывает WebApp и открывает чат с ботом
                Telegram.WebApp.close();
                console.log("Telegram.WebApp.close() вызван из модального окна.");
                const botUsername = 'Alex_tictactoeBot';
                const botLink = `https://t.me/${botUsername}`;
                console.log("Попытка открыть чат с ботом из модального окна:", botLink);
                Telegram.WebApp.openTelegramLink(botLink);
            } catch (e) {
                Telegram.showPopup({ title: "Ошибка", message: `Не удалось завершить игру: ${e.message}` });
                console.error(`Ошибка завершения игры: ${e.message}`);
            }
        }

        // --- ИСПРАВЛЕНО: closeGameBtn теперь вызывает closeGame ---
        async function closeGame() {
            console.log("closeGame вызвана. gameId:", gameId);
            try {
                console.log("Отправка запроса на завершение игры перед закрытием приложения:", gameId);
                const res = await fetch(`${BACKEND}/api/end-game`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: Telegram.initData, game_id: gameId })
                });
                if (!res.ok) {
                    const errorText = await res.text();
                    console.warn("Предупреждение: не удалось завершить игру на сервере перед закрытием:", errorText);
                    // Даже если сервер не принял запрос, всё равно закрываем приложение
                } else {
                    console.log("Запрос на завершение игры отправлен перед закрытием.");
                }
            } catch (e) {
                console.warn("Предупреждение: ошибка при попытке завершить игру перед закрытием:", e.message);
                // Даже если произошла ошибка, всё равно закрываем приложение
            } finally {
                // Закрывает WebApp
                Telegram.WebApp.close();
                console.log("Telegram.WebApp.close() вызван.");

                // --- НОВОЕ: Открывает чат с ботом ---
                const botUsername = 'Alex_tictactoeBot'; // Убедитесь, что имя пользователя верно
                const botLink = `https://t.me/${botUsername}`;
                console.log("Попытка открыть чат с ботом:", botLink);
                Telegram.WebApp.openTelegramLink(botLink);
                // ------------------------------------
            }
        }

        async function makeMove(row, col) {
            console.log("Попытка сделать ход в ячейку:", row, col, "Game ID:", gameId);
            if (!gameId) {
                console.warn("Ход невозможен: gameId не установлен");
                Telegram.showPopup({ title: "Ошибка", message: "Невозможно сделать ход: ID игры не установлен." });
                return;
            }
            try {
                if (typeof row !== 'number' || typeof col !== 'number' || row < 0 || row > 2 || col < 0 || col > 2) {
                    throw new Error(`Некорректные координаты хода: row=${row}, col=${col}`);
                }
                // --- ИСПРАВЛЕНО: используем актуальный gameId ---
                const res = await fetch(`${BACKEND}/api/make-move`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initData: Telegram.initData, game_id: gameId, row, col })
                });
                if (!res.ok) {
                    const errorText = await res.text();
                    console.error(`Сервер вернул ошибку: ${res.status} ${res.statusText}`, errorText);
                    throw new Error(`Сервер вернул ошибку: ${res.status} ${res.statusText}`);
                }
                console.log("Ход успешно отправлен.");
            } catch (e) {
                Telegram.showPopup({ title: "Ошибка", message: `Не удалось сделать ход: ${e.message}` });
                console.error(`Ошибка хода: ${e.message}`);
            }
        }

        function renderEmptyBoard() {
            boardDiv.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    boardDiv.appendChild(cell);
                }
            }
        }

        // --- ИСПРАВЛЕНО: renderGame получает gameData и синхронизирует gameId ---
        function renderGame(gameData) {
            // --- ИСПРАВЛЕНО: разблокируем доску при получении данных новой игры, если это текущий gameId ---
            if (gameData.id === gameId) { // Убедимся, что это данные для *текущей* игры
                boardDiv.style.pointerEvents = 'auto';
                boardDiv.style.opacity = '1';
            }

            console.log("Отрисовка игры с данными (ID:", gameData.id, "). Текущий gameId:", gameId);
            if (!Telegram.initDataUnsafe || !Telegram.initDataUnsafe.user) {
                console.error("Telegram WebApp initDataUnsafe.user недоступен при отрисовке.");
                statusDiv.textContent = "Ошибка: Не удалось получить данные пользователя.";
                return;
            }
            const user = Telegram.initDataUnsafe.user;
            const myId = String(user.id);
            const isCreator = myId === String(gameData.creator_id);

            // --- ИСПРАВЛЕНО: показываем кнопки ---
            restartGameBtn.style.display = 'inline-block';
            closeGameBtn.style.display = 'inline-block';

            // --- ИСПРАВЛЕНО: делаем кнопку "Новая игра" активной/неактивной ---
            if (isCreator) {
                restartGameBtn.classList.remove('inactive');
                restartGameBtn.disabled = false;
            } else {
                restartGameBtn.classList.add('inactive');
                restartGameBtn.disabled = true;
            }

            let boardToRender = gameData.board;
            if (typeof boardToRender === 'string') {
                try {
                    boardToRender = JSON.parse(boardToRender);
                } catch (e) {
                    console.error("Ошибка парсинга доски:", e, boardToRender);
                    statusDiv.textContent = "Ошибка: неверный формат доски.";
                    return;
                }
            }
            if (!Array.isArray(boardToRender) || boardToRender.length !== 3 || !boardToRender.every(r => Array.isArray(r) && r.length === 3)) {
                console.error("Доска имеет неверный формат:", boardToRender);
                statusDiv.textContent = "Ошибка: неверный формат доски.";
                return;
            }

            const isFinished = Boolean(gameData.winner) || gameData.winner === "draw";

            if (gameData.winner === 'draw') {
                statusDiv.textContent = "Ничья!";
            } else if (gameData.winner) {
                const winnerName = gameData.winner === 'X' ? gameData.creator_name : (gameData.opponent_name || 'Игрок');
                statusDiv.textContent = `Победил(а) ${winnerName}!`;
            } else if (!gameData.opponent_id) {
                statusDiv.textContent = "Ожидание второго игрока...";
                startGameBtn.style.display = 'none';
                boardDiv.style.display = 'none';
                inviteLinkDiv.style.display = 'block';
                copyLinkBtn.style.display = 'block';
            } else if (!gameData.game_started) {
                statusDiv.textContent = "Ожидание начала игры...";
                boardDiv.style.display = 'none';
                inviteLinkDiv.style.display = 'none';
                copyLinkBtn.style.display = 'none';
                if (!isCreator) {
                    startGameBtn.style.display = 'inline-block';
                } else {
                    startGameBtn.style.display = 'none';
                }
            } else {
                statusDiv.textContent = "Игра началась!";
                startGameBtn.style.display = 'none';
                boardDiv.style.display = 'grid';
                inviteLinkDiv.style.display = 'none';
                copyLinkBtn.style.display = 'none';

                boardDiv.innerHTML = '';
                for (let i = 0; i < 3; i++) {
                    for (let j = 0; j < 3; j++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        const val = boardToRender[i][j];
                        if (val) {
                            if (val === 'X' || val === 'O') {
                                cell.textContent = val;
                                cell.classList.add(val.toLowerCase());
                                const isWinnerCell = gameData.winner && val === gameData.winner && Array.isArray(gameData.win_combo) && gameData.win_combo.includes(`${i},${j}`);
                                if (isWinnerCell) cell.classList.add('winner');
                            } else {
                                cell.textContent = '';
                            }
                        }
                        // --- ИСПРАВЛЕНО: передаём gameId внутрь обработчика ---
                        if (gameData.game_started && !isFinished && gameData.current_turn == myId && !val) {
                            // Создаём замыкание для текущего gameId
                            const currentGameId = gameData.id; // Используем ID из gameData
                            cell.onclick = () => {
                                // Проверяем, актуален ли gameId на момент клика
                                if (currentGameId === gameId) {
                                    makeMove(i, j);
                                } else {
                                    console.warn(`Клик на поле ${i},${j} проигнорирован: gameId изменился (${currentGameId} != ${gameId})`);
                                    Telegram.showPopup({ title: "Ошибка", message: "Ход не выполнен: игра переключилась." });
                                }
                            };
                            cell.style.cursor = 'pointer';
                        } else {
                            cell.onclick = null;
                            cell.style.cursor = 'default';
                        }
                        boardDiv.appendChild(cell);
                    }
                }

                if (!isFinished) {
                    if (gameData.current_turn == myId) {
                        statusDiv.textContent = "Ваш ход!";
                    } else {
                        statusDiv.textContent = "Ход соперника...";
                    }
                } else {
                    showEndModal(isCreator, gameData);
                }
            }

            if (gameData.opponent_id) {
                document.getElementById('chatBox').style.display = 'block';
            } else {
                document.getElementById('chatBox').style.display = 'none';
            }
        }

        function showEndModal(isCreator, game) {
            if (endModalShown) return;
            let endText = "";
            if (game.winner === "draw") {
                endText = "Игра окончена: ничья";
            } else {
                const winnerName = (game.winner === "X") ? game.creator_name : (game.opponent_name || "Игрок");
                endText = `Победил(а): ${winnerName}`;
            }
            endWinnerText.textContent = endText;

            if (isCreator) {
                endGameBtn.style.display = 'inline-block';
                restartGameModalBtn.style.display = 'inline-block';
            } else {
                endGameBtn.style.display = 'none';
                restartGameModalBtn.style.display = 'none';
            }
            closeEndModalBtn.textContent = "Закрыть";
            endModal.style.display = 'flex';
            endModalShown = true;
        }

        function hideEndModal() {
            endModal.style.display = 'none';
            endModalShown = false;
            endGameBtn.style.display = 'none';
            restartGameModalBtn.style.display = 'none';
        }

        copyLinkBtn.onclick = () => {
            const linkEl = inviteLinkDiv.querySelector('a');
            if (!linkEl) {
                console.error("Элемент ссылки не найден для копирования.");
                Telegram.showPopup({ title: "❌ Ошибка", message: "Не удалось найти ссылку для копирования." });
                return;
            }
            const url = linkEl.href;
            navigator.clipboard.writeText(url).then(() => {
                Telegram.showPopup({ title: "✅ Скопировано!", message: "Ссылка скопирована!" });
            }).catch(() => {
                Telegram.showPopup({ title: "❌ Ошибка", message: "Не удалось скопировать ссылку." });
            });
        };

        startGameBtn.onclick = startGame;
        restartGameBtn.onclick = restartGame;
        // --- ИСПРАВЛЕНО: closeGameBtn.onclick теперь вызывает closeGame ---
        closeGameBtn.onclick = closeGame;

        // --- ИСПРАВЛЕНО: sendBtn.onclick использует глобальный chatWs ---
        sendBtn.onclick = () => {
            console.log("sendBtn clicked. chatWs readyState:", chatWs ? chatWs.readyState : "null", "gameId:", gameId);
            const text = chatInput.value.trim();
            // --- ИСПРАВЛЕНО: проверяем, что chatWs существует и открыт ---
            if (text && chatWs && chatWs.readyState === WebSocket.OPEN) {
                try {
                    chatWs.send(JSON.stringify({ text })); // Только текст
                    console.log("Сообщение отправлено в чат:", text);
                    chatInput.value = '';
                } catch (e) {
                    Telegram.showPopup({ title: "Ошибка", message: "Не удалось отправить сообщение." });
                    console.error(`Ошибка отправки сообщения в WebSocket чата: ${e.message}`);
                }
            } else {
                 Telegram.showPopup({ title: "Ошибка", message: "Соединение с чатом не установлено." });
                 console.log("Соединение с чатом не установлено. Попытка переподключения.");
                 // Попробовать переподключиться, если gameId установлен
                 if (gameId) {
                      connectChatWs(gameId); // Повторно подключаемся к чату новой игры
                 }
            }
        };

        chatInput.onkeypress = (e) => { if (e.key === 'Enter') sendBtn.click(); };

        document.addEventListener('DOMContentLoaded', async () => {
            console.log("DOMContentLoaded с initDataUnsafe:", Telegram.initDataUnsafe);
            await loadStats();

            // Привязка кнопок модального окна один раз
            endGameBtn.onclick = endGameFromModal; // Теперь закрывает WebApp и открывает чат
            restartGameModalBtn.onclick = () => {
                restartGame();
                hideEndModal();
            };
            closeEndModalBtn.onclick = hideEndModal;

            if (startParam && typeof startParam === 'string' && startParam.length === 8) {
                console.log("Найден startParam, пытаемся присоединиться к игре:", startParam);
                await joinGame(startParam);
            } else {
                console.log("Нет корректного startParam, создаем новую игру.");
                await createGame();
            }
        });
    </script>
</body>
</html>
